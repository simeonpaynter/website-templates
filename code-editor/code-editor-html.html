<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, CSS, JavaScript Code Editor - Simeon Paynter</title>
    <!-- CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        background-color: #D4D4D4;
        font-family: "Poppins", Roboto, arial, sans-serif;
      }
      .editor {
        display: flex;
        text-align: start;
        width: 100%;
        gap: 48px;
      }
      label {
        display: flex;
        align-items: center;
        font-size: 24px;
      }
      textarea {
        background-color: #F4F0FF;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        border-size: 2px;
        border-color: #D4C3FE;
        border-radius: 2px;
        margin: 5px;
        width: 100%;
        height: 250px;
      }
      iframe {
        height: 90%;
        width: 100%;
        border: 4px solid #0C0C0C;
        border-radius: 4px;
        outline: 0;
        margin: 5px;
        background: #FFF;
      }
      
    </style>
  </head>

  <body>
    <header>
      <h1>HTML, CSS, JavaScript Code Editor</h1>
    </header>

    <section class="code-editor">
      <h1>Tool for rapid html, css, and javascript editing.</h1>
      
      <div class="editor">
        
        <div class="left-panel">
          <label>HTML Editor</label>
          <textarea spellcheck="false" onkeyup="runResults()" placeholder = "<h1><b>hello world!</b></h1> <p>Example of a paragraph...</p>" id="html-input"></textarea>
          
          <label>CSS Editor</label>
          <textarea spellcheck="false" onkeyup="runResults()" placeholder ="h1 { color: #DFDFDF;}" id="css-input"></textarea>
          
          <label>JavaScript Editor</label>
          <textarea spellcheck="false" onkeyup="runResults()" placeholder ="javascript" id="js-input"></textarea>
        </div>
        
        <div class="right-panel">
          <label>Preview</label>
          <iframe id="results-output"></iframe>
        </div>
      
      </div> 
    </section>

    <placeholder>placeholder for download(zip or separate files)</placeholder>
    <placeholder>placeholder for color picker</placeholder>

    <footer>
      <p>Placeholder for footer items</p>
      
    </footer>

      <script>
          function runResults() {
            let htmlCode = document.getElementById("html-input").value;
            let cssCode = document.getElementById("css-input").value;
            let jsCode = document.getElementById("js-input").value;
            let output = document.getElementById("results-output");

            output.contentDocument.body.innerHTML = htmlCode;

            let style = output.contentDocument.createElement('style');
            style.textContent = cssCode;
            output.contentDocument.head.appendChild(style);

            let script = output.contentDocument.createElement('script');
            script.textContent = jsCode;
            output.contentDocument.head.appendChild(script);
      </script>
  </body>
</html>
