<!doctype html>
<!-- Last Updated: October 5 2026-->
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, CSS, JavaScript Code Editor - Simeon Paynter</title>
    <!-- CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        background-color: #D4D4D4;
        font-family: "Poppins", Roboto, arial, sans-serif;
      }
      .editor {
        display: flex;
        text-align: start;
        width: 100%;
        gap: 48px;
      }
      label {
        display: flex;
        align-items: center;
        font-size: 24px;
      }
      textarea {
        background-color: #F4F0FF;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        border-size: 2px;
        border-color: #D4C3FE;
        border-radius: 2px;
        width: 100%;
        height: 250px;
      }
      iframe {
        height: 90%;
        width: 100 px;
        border-size: 4px;
        border-color: #D4C3FE;
        border-radius: 4px;
        outline:0;
        background: #FFF;
      }
      
    </style>
  </head>

  <body>
    <header>
      <h1>HTML, CSS, JavaScript Code Editor</h1>
    </header>

    <section class="code-editor">
      <h1>Tool for rapid html, css, and javascript editing.</h1>
      
      <div class="editor">
        
        <div class="left-panel">
          <label>HTML Editor</label>
          <textarea spellcheck="false" onkeyup="run()" placeholder = "<h1><b>hello world!</b></h1> <p>Example of a paragraph...</p>" id="html-input"></textarea>
          
          <label>CSS Editor</label>
          <textarea spellcheck="false" onkeyup="run()" placeholder ="h1 { color: #DFDFDF;}" id="css-input"></textarea>
          
          <label>JavaScript Editor</label>
          <textarea spellcheck="false" onkeyup="run()" placeholder ="console.log('running log');" id="js-input"></textarea>
        </div>
        
        <div class="right-panel">
          <label>Preview</label>
          <iframe id="results-output"></iframe>
        </div>
      
      </div> 
    </section>

    <placeholder>placeholder for color picker</placeholder>

    <footer>
      <p>Placeholder for footer items</p>
    </footer>


      <!-- Internal JavaScript goes here -->
      <script>
          function run() {
            let htmlCode = document.getElementByID("html-input");
            let cssCode = document.getElementByID("css-input");
            let jsCode = document.getElementByID("js-input");
            let output = document.getElementByID("results-output").contentWindow.document;

            output.open();
            output.write(`
                <!DOCTYPE html>
                <html lang="en-US">
                <head>
                    <style>${cssCode}</style>
                </head>
                <body>
                    ${htmlCode}
                    <script>${jsCode}<\/script>
                </body>
                </html>
            `);
            output.close();
          }
            //output.contentDocument.body.innerHTML = htmlCode.value + "<style>" + cssCode.value + "</style">;
            //output.contentWindow.eval(jsCode.value);
      </script>
  </body>
</html>
