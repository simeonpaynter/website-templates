<!doctype html>
<!-- Last Updated: October 5 2026 2:45-->
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, CSS, JavaScript Code Editor - Simeon Paynter</title>
    <!-- CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        background-color: #D4D4D4;
        font-family: "Poppins", Roboto, arial, sans-serif;
      }
      .editor {
        display: flex;
        flex: wrap row;
        background-color: #111111;
        text-align: start;
        gap: 48px;
      }
      label {
        display: flex;
        align-items: center;
        font-size: 24px;
      }
      textarea {
        background-color: #F4F0FF;
        font-family: 'Courier New', monospace;
        font-size: 18px;
        border-size: 2px;
        border-color: #D4C3FE;  
        width: 100%;
        height: 250px;
      }
      
    </style>
  </head>

  <body>
    <header>
      <h1>HTML, CSS, JavaScript Code Editor</h1>
    </header>

    <section class="code-editor">
      <h1>Tool for rapid html, css, and javascript editing.</h1>
      
      <div class="editor">
        
        <div class="left-panel">
          <label>HTML Editor</label>
          <textarea id="html-input"></textarea>
          
          <label>CSS Editor</label>
          <textarea id="css-input"></textarea>
          
          <label>JavaScript Editor</label>
          <textarea id="js-input"></textarea>
        </div>
        
        <div class="right-panel">
          <label>Results</label>
          <iframe id="results-output"></iframe>
        </div>
      
      </div> 
    </section>

    <placeholder>placeholder for color picker</placeholder>

    <footer>
      <p>Placeholder for footer items</p>
    </footer>
  
  </body>
</html>
